[project]
name = "store-scenario-inspiration"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed>=0.7,<0.8",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
]

[project.scripts]
store-catalog = "store_scenario_inspiration.catalog.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `scripts.x` importable as a namespace package; "scripts" supports
# the bare `import x` style some tests use. Both styles exist today.
pythonpath = [".", "src", "scripts"]
