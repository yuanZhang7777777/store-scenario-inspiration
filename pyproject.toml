[project]
name = "store-scenario-inspiration"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.7,<0.8",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32,<1",
]

[project.scripts]
store-catalog = "store_scenario_inspiration.catalog.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `scripts.x` importable as a namespace package; "scripts" supports
# the bare `import x` style some tests use. Both styles exist today.
pythonpath = [".", "src", "scripts"]
